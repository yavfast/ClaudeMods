categories:
  - category: concurrency
    file: concurrency.md
    summary: Storage folder and commit order in hook work that spans awaits, session switches and abandoned handlers.
    applies_to:
      paths: ["mods/*/hooks/**"]
      phases: [implement, fix, review]
    rules:
      - name: CONC-01
        severity: should
        summary: Take the storage folder once per operation
      - name: CONC-02
        severity: should
        summary: Commit side effects only after the last abort check
  - category: structure
    file: structure.md
    summary: Where shared row predicates, host-matched literals and state decisions live in hook modules.
    applies_to:
      paths: ["mods/*/hooks/**"]
      phases: [implement, fix, review]
    rules:
      - name: STRUCT-01
        severity: should
        summary: Give each row predicate and shared literal one home
      - name: STRUCT-02
        severity: should
        summary: "Keep decisions out of register.ts: a branch over state goes into a ports module with a test"
  - category: error-handling
    file: errors.md
    summary: How background hook work records the failures it swallows.
    applies_to:
      paths: ["mods/*/hooks/**"]
      phases: [implement, fix, review]
    rules:
      - name: ERR-01
        severity: should
        summary: Let every swallowed failure of background work leave one debug line with a label and the error, never content
  - category: process
    file: process.md
    summary: How task files and session history in .dev_flow record times.
    applies_to:
      paths: [".dev_flow/tasks/**", ".dev_flow/session_history/**", ".dev_flow/active_context.md"]
    rules:
      - name: PROC-01
        severity: should
        summary: Take log timestamps from git or the clock, never estimate them
